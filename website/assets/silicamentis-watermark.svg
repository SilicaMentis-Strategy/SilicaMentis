<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
  <!-- Single-colour (Paper) mark for faint watermarks on dark sections. -->
  <defs>
    <mask id="wm-cut-1" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
      <rect width="120" height="120" fill="#fff"/>
      <rect x="32.5" y="32.5" width="55" height="55" fill="none" stroke="#000" stroke-width="11"/>
      <rect x="46" y="6" width="68" height="68" fill="#000"/>
    </mask>
    <mask id="wm-cut-2" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
      <rect width="120" height="120" fill="#fff"/>
      <rect x="46" y="6" width="68" height="68" fill="#000"/>
    </mask>
  </defs>
  <rect x="12.5" y="52.5" width="55" height="55" fill="none" stroke="#F2EEE6" stroke-width="5" mask="url(#wm-cut-1)"/>
  <rect x="32.5" y="32.5" width="55" height="55" fill="none" stroke="#F2EEE6" stroke-width="5" mask="url(#wm-cut-2)"/>
  <rect x="50" y="10" width="60" height="60" fill="#F2EEE6"/>
</svg>
