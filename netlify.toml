# Netlify settings for silicamentis.eu
# The site lives in website/; nothing outside it is published.
# Static site: no build command.

[build]
  base = "website"
  publish = "."     # relative to base, so this means website/

# Keep the private admin area (added later for the Instagram pipeline)
# out of search engines and out of other sites' frames.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Cache-Control = "no-store"
